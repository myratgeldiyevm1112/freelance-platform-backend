<rect x="715" y="496" width="80"  height="26" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#2C2C2A" x="105" y="514" text-anchor="middle">UserRepo</text>
<text font-family="sans-serif" font-size="11" fill="#2C2C2A" x="215" y="514" text-anchor="middle">PaymentRepo</text>
<text font-family="sans-serif" font-size="11" fill="#2C2C2A" x="330" y="514" text-anchor="middle">SA models</text>
<text font-family="sans-serif" font-size="11" fill="#2C2C2A" x="430" y="514" text-anchor="middle">Postgres</text>
<text font-family="sans-serif" font-size="11" fill="#2C2C2A" x="510" y="514" text-anchor="middle">Redis</text>
<text font-family="sans-serif" font-size="11" fill="#2C2C2A" x="590" y="514" text-anchor="middle">Stripe</text>
