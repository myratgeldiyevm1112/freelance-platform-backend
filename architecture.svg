<svg width="100%" viewBox="0 0 860 600" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Freelance Platform Clean Architecture v1.3</title>
<desc>Four layers: API, Application, Domain, Infrastructure</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- API Layer -->
<rect x="40" y="30" width="780" height="130" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text font-family="sans-serif" font-weight="500" font-size="14" fill="#0C447C" x="430" y="58" text-anchor="middle">API layer</text>
<text font-family="sans-serif" font-size="12" fill="#185FA5" x="430" y="76" text-anchor="middle">routers · dependencies · middleware</text>

<rect x="55"  y="86" width="84"  height="26" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="149" y="86" width="84"  height="26" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="243" y="86" width="100" height="26" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="353" y="86" width="100" height="26" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="463" y="86" width="84"  height="26" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="557" y="86" width="100" height="26" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="667" y="86" width="80" height="26" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="755" y="86" width="60" height="26" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#0C447C" x="97"  y="104" text-anchor="middle">auth.py</text>
<text font-family="sans-serif" font-size="11" fill="#0C447C" x="191" y="104" text-anchor="middle">jobs.py</text>
<text font-family="sans-serif" font-size="11" fill="#0C447C" x="293" y="104" text-anchor="middle">proposals.py</text>
<text font-family="sans-serif" font-size="11" fill="#0C447C" x="403" y="104" text-anchor="middle">contracts.py</text>
<text font-family="sans-serif" font-size="11" fill="#0C447C" x="505" y="104" text-anchor="middle">reviews.py</text>
<text font-family="sans-serif" font-size="11" fill="#0C447C" x="607" y="104" text-anchor="middle">payments.py</text>
<text font-family="sans-serif" font-size="11" fill="#0C447C" x="707" y="104" text-anchor="middle">msg·notif</text>
<text font-family="sans-serif" font-size="11" fill="#0C447C" x="785" y="104" text-anchor="middle">admin</text>

<rect x="55" y="118" width="100" height="26" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="165" y="118" width="100" height="26" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#0C447C" x="105" y="136" text-anchor="middle">disputes.py</text>
<text font-family="sans-serif" font-size="11" fill="#0C447C" x="215" y="136" text-anchor="middle">freelancers.py</text>
<line x1="430" y1="192" x2="430" y2="218" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Application Layer -->
<rect x="40" y="190" width="780" height="100" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="sans-serif" font-weight="500" font-size="14" fill="#085041" x="430" y="218" text-anchor="middle">Application layer</text>
<text font-family="sans-serif" font-size="12" fill="#0F6E56" x="430" y="236" text-anchor="middle">use cases · DTOs · interfaces</text>

<rect x="55"  y="248" width="110" height="26" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="175" y="248" width="90"  height="26" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="275" y="248" width="120" height="26" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="405" y="248" width="110" height="26" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="525" y="248" width="110" height="26" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="645" y="248" width="110" height="26" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#085041" x="110" y="266" text-anchor="middle">register_user</text>
<text font-family="sans-serif" font-size="11" fill="#085041" x="220" y="266" text-anchor="middle">create_job</text>
<text font-family="sans-serif" font-size="11" fill="#085041" x="335" y="266" text-anchor="middle">submit_proposal</text>
<text font-family="sans-serif" font-size="11" fill="#085041" x="460" y="266" text-anchor="middle">leave_review</text>
<text font-family="sans-serif" font-size="11" fill="#085041" x="580" y="266" text-anchor="middle">send_message</text>
<text font-family="sans-serif" font-size="11" fill="#085041" x="700" y="266" text-anchor="middle">IRepository</text>

<line x1="430" y1="292" x2="430" y2="318" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Domain Layer -->
<rect x="40" y="320" width="780" height="100" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-family="sans-serif" font-weight="500" font-size="14" fill="#3C3489" x="430" y="348" text-anchor="middle">Domain layer</text>
<text font-family="sans-serif" font-size="12" fill="#534AB7" x="430" y="366" text-anchor="middle">entities · exceptions · business rules (no external deps)</text>

<rect x="55"  y="378" width="90"  height="26" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<rect x="155" y="378" width="80"  height="26" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
