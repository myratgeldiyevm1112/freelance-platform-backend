<rect x="365" y="378" width="110" height="26" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<rect x="485" y="378" width="110" height="26" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<rect x="605" y="378" width="80" height="26" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<rect x="695" y="378" width="100" height="26" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#3C3489" x="100" y="396" text-anchor="middle">UserEntity</text>
<text font-family="sans-serif" font-size="11" fill="#3C3489" x="195" y="396" text-anchor="middle">JobEntity</text>
<text font-family="sans-serif" font-size="11" fill="#3C3489" x="300" y="396" text-anchor="middle">ProposalEntity</text>
<text font-family="sans-serif" font-size="11" fill="#3C3489" x="420" y="396" text-anchor="middle">PaymentEntity</text>
<text font-family="sans-serif" font-size="11" fill="#3C3489" x="540" y="396" text-anchor="middle">MessageEntity</text>
<text font-family="sans-serif" font-size="11" fill="#3C3489" x="645" y="396" text-anchor="middle">AppError</text>
<text font-family="sans-serif" font-size="11" fill="#3C3489" x="745" y="396" text-anchor="middle">DisputeEntity</text>

<path d="M430 440 L430 378" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

<!-- Infrastructure Layer -->
<rect x="40" y="440" width="780" height="110" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-family="sans-serif" font-weight="500" font-size="14" fill="#2C2C2A" x="430" y="468" text-anchor="middle">Infrastructure layer</text>
<text font-family="sans-serif" font-size="12" fill="#5F5E5A" x="430" y="486" text-anchor="middle">repositories · models · PostgreSQL · Redis · Stripe · S3 · Celery · WebSocket</text>

<rect x="55"  y="496" width="100" height="26" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="165" y="496" width="100" height="26" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="275" y="496" width="110" height="26" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="395" y="496" width="70"  height="26" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="475" y="496" width="70"  height="26" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="555" y="496" width="70"  height="26" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
