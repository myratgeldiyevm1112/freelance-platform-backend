services:
  - type: web
    name: freelance-platform-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: DATABASE_URL
        fromDatabase:
          name: freelance-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: freelance-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: freelance-redis
          type: redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: AWS_ACCESS_KEY
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: freelance-platform
      - key: S3_ENDPOINT_URL
        sync: false

databases:
  - name: freelance-db
    databaseName: freelance_db
    user: freelance_user

  - type: redis
    name: freelance-redis
    ipAllowList: []